name: Validate

# hassfest checks the manifest, translations and config flow against Home Assistant's rules;
# the HACS action checks the repository layout, hacs.json and the repository metadata
# (description, topics). Weekly, because the rules change with Home Assistant.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # brands are only needed for the default HACS list, not for a custom repository
          ignore: brands
