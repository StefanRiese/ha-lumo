name: Release

# Push a tag like v0.2.0: checks that manifest.json carries the same version (HACS installs the
# repository at the tag) and publishes a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: manifest.json version matches the tag
        run: bash scripts/version.sh check "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
